<!doctype html>
<html lang="es" class="h-full bg-slate-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Proyectos & Tablero Kanban</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React y Babel CDN -->
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FullCalendar (librería de calendario para la vista de Calendario de Tareas) -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.21/locales/es.global.min.js"></script>

    <style>
      /* Tipografía Inter y estilos personalizados */
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }

      /* Animaciones para arrastrar y soltar */
      .dragging {
        opacity: 0.5;
        transform: scale(0.98);
      }
      .drag-over {
        border-color: #3b82f6 !important;
        background-color: #eff6ff !important;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Ajustes de FullCalendar para combinar con el tema de la app */
      .fc {
        --fc-border-color: #e2e8f0;
        --fc-today-bg-color: #eef2ff;
        --fc-button-bg-color: #4f46e5;
        --fc-button-border-color: #4f46e5;
        --fc-button-hover-bg-color: #4338ca;
        --fc-button-hover-border-color: #4338ca;
        --fc-button-active-bg-color: #4338ca;
        font-family: "Inter", sans-serif;
        font-size: 0.85rem;
      }
      .fc .fc-toolbar-title {
        font-size: 1.05rem;
        font-weight: 700;
        color: #1e293b;
      }
      .fc .fc-button {
        text-transform: capitalize;
        box-shadow: none !important;
      }
      .fc .fc-daygrid-day-number,
      .fc .fc-col-header-cell-cushion {
        color: #475569;
      }
      .fc-event {
        cursor: pointer;
        border: none !important;
      }
    </style>
  </head>
  <body class="h-full font-sans antialiased text-slate-800">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Estados por defecto del Kanban.
      // Nota: "en_revision" y "rechazado" solo aplican a tareas marcadas con
      // "needsReview" (necesita revisión); las demás pasan directo de
      // "en_proceso" a "finalizado".
      const COLUMNS = [
        {
          id: "no_iniciado",
          title: "No Iniciado",
          badgeBg: "bg-slate-300",
          badgeText: "text-slate-700",
          borderTop: "border-slate-400",
          icon: "circle",
        },
        {
          id: "en_proceso",
          title: "En Proceso",
          badgeBg: "bg-amber-50",
          badgeText: "text-amber-700",
          borderTop: "border-amber-500",
          icon: "clock",
        },
        {
          id: "en_revision",
          title: "En Revisión",
          badgeBg: "bg-violet-50",
          badgeText: "text-violet-700",
          borderTop: "border-violet-500",
          icon: "search",
        },
        {
          id: "rechazado",
          title: "Rechazado",
          badgeBg: "bg-red-50",
          badgeText: "text-red-700",
          borderTop: "border-red-500",
          icon: "x-circle",
        },
        {
          id: "finalizado",
          title: "Finalizado",
          badgeBg: "bg-emerald-50",
          badgeText: "text-emerald-700",
          borderTop: "border-emerald-500",
          icon: "check-circle",
        },
      ];

      const COLUMNS2 = [
        {
          id: "no_iniciado",
          title: "No Iniciado",
          badgeBg: "bg-slate-300",
          badgeText: "text-slate-700",
          borderTop: "border-slate-400",
          icon: "circle",
        },
        {
          id: "en_proceso",
          title: "En Proceso",
          badgeBg: "bg-amber-50",
          badgeText: "text-amber-700",
          borderTop: "border-amber-500",
          icon: "clock",
        },
        
        {
          id: "finalizado",
          title: "Finalizado",
          badgeBg: "bg-emerald-50",
          badgeText: "text-emerald-700",
          borderTop: "border-emerald-500",
          icon: "check-circle",
        },
      ];

      // Estados que solo tienen sentido para tareas que requieren revisión
      const REVIEW_ONLY_STATUSES = ["en_revision", "rechazado"];

      // Estados por defecto del tablero de Incidencias
      const INCIDENT_COLUMNS = [
        {
          id: "abierta",
          title: "Abierta",
          badgeBg: "bg-red-50",
          badgeText: "text-red-700",
          borderTop: "border-red-500",
          icon: "alert-circle",
        },
        {
          id: "en_proceso",
          title: "En Proceso",
          badgeBg: "bg-amber-50",
          badgeText: "text-amber-700",
          borderTop: "border-amber-500",
          icon: "clock",
        },
        {
          id: "resuelta",
          title: "Resuelta",
          badgeBg: "bg-emerald-50",
          badgeText: "text-emerald-700",
          borderTop: "border-emerald-500",
          icon: "check-circle",
        },
      ];

      // Roles del sistema. Cada usuario debe tener exactamente uno de estos roles,
      // ya que determinan qué puede ver y hacer dentro de la aplicación.
      const ROLES = ["Admin", "Desarrollador", "Ayudante"];

      // Roles con acceso total: ven todos los proyectos, pueden crearlos,
      // y tienen permisos completos sobre tareas e incidencias.
      const isFullAccessRole = (role) =>
        role === "Admin" || role === "Desarrollador";

      // El rol Ayudante tiene acceso restringido: solo sus tareas asignadas,
      // solo proyectos donde tiene tareas, y solo puede reportar/ver incidencias.
      const isHelperRole = (role) => role === "Ayudante";

      // Utilidad para obtener las iniciales de un usuario (avatares)
      const getInitials = (name) => {
        if (!name) return "?";
        return name
          .trim()
          .split(/\s+/)
          .slice(0, 2)
          .map((w) => w[0].toUpperCase())
          .join("");
      };

      // Datos iniciales vacíos por defecto
      const INITIAL_PROJECTS = [];
      const INITIAL_TASKS = [];
      const INITIAL_MODULES = [];
      const INITIAL_USERS = [];
      const INITIAL_INCIDENTS = [];

      // Componente de Calendario: muestra las tareas de todos los proyectos en un calendario mensual
      // usando la librería FullCalendar. Admin y Desarrollador ven todas las tareas; los Ayudantes
      // solo ven las tareas que tienen asignadas.
      function CalendarView({
        tasks,
        projects,
        modules,
        users,
        currentUserId,
        isHelper,
        hasFullAccess,
        onOpenSidebar,
        onOpenTask,
        onCreateTask,
        onToggleTaskDone,
        onSetTaskStatus,
        onToggleSubtarea,
        filterProjectId,
        setFilterProjectId,
        filterUserId,
        setFilterUserId,
        filterModuleId,
        setFilterModuleId,
        hideHeader = false,
        hideProjectFilter = false,
        hideModuleFilter = false,
      }) {
        const calendarElRef = useRef(null);
        const calendarInstanceRef = useRef(null);

        // Fecha actualmente seleccionada en el calendario (por defecto, hoy). Se usa para
        // mostrar la lista de tareas de ese día en el panel lateral.
        const [selectedDate, setSelectedDate] = useState(() =>
          new Date().toISOString().slice(0, 10),
        );
        const [selectedAcordion, setSelectedAcordion] = useState([
          selectedDate,
        ]);

        // Filtro de la lista: 'hoy' o 'mensual'
        const [taskListFilter, setTaskListFilter] = useState("mensual");

        // Expandidos de subtareas por tarea id
        const [expandedSubtareas, setExpandedSubtareas] = useState({});

        // Opciones de usuario del filtro: si hay un proyecto elegido, solo sus miembros
        const filterUserOptions =
          filterProjectId === "all"
            ? users
            : users.filter((u) =>
                (
                  projects.find((p) => p.id === filterProjectId)
                    ?.memberUserIds || []
                ).includes(u.id),
              );

        // Opciones de módulo del filtro: si hay un proyecto elegido, solo los módulos de ese proyecto
        const filterModuleOptions =
          filterProjectId === "all"
            ? modules
            : modules.filter((m) => m.projectId === filterProjectId);

        // Si cambia el proyecto filtrado y el usuario/módulo ya no pertenece a él, se resetean
        useEffect(() => {
          if (
            filterUserId !== "all" &&
            !filterUserOptions.some((u) => u.id === filterUserId)
          ) {
            setFilterUserId("all");
          }
          if (
            filterModuleId !== "all" &&
            !filterModuleOptions.some((m) => m.id === filterModuleId)
          ) {
            setFilterModuleId("all");
          }
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [filterProjectId]);

        // Tareas visibles según el rol del usuario actual
        const roleVisibleTasks = isHelper
          ? tasks.filter((t) =>
              (t.assignedUserIds || []).includes(currentUserId),
            )
          : tasks;

        // Tareas visibles tras aplicar además los filtros de proyecto, usuario y módulo
        const visibleTasks = roleVisibleTasks.filter((t) => {
          if (filterProjectId !== "all" && t.projectId !== filterProjectId)
            return false;
          if (
            filterUserId !== "all" &&
            !(t.assignedUserIds || []).includes(filterUserId)
          )
            return false;
          if (filterModuleId !== "all" && t.moduleId !== filterModuleId)
            return false;
          return true;
        });

        // Solo las tareas con fecha de inicio definida pueden ubicarse en el calendario
        const tasksWithDate = visibleTasks.filter((t) => t.startDate);
        const tasksWithoutDate = visibleTasks.filter((t) => !t.startDate);

        // Fecha de hoy en formato YYYY-MM-DD
        const todayStr = new Date().toISOString().slice(0, 10);

        // Tareas filtradas según el modo Hoy / Mensual
        const filteredTasksForList = taskListFilter === "hoy"
          ? tasksWithDate.filter((t) => t.startDate === todayStr)
          : tasksWithDate;

        // Tareas del día actualmente seleccionado, para el panel lateral de lista
        const dayTasks = Object.entries(
          filteredTasksForList
            .sort((a, b) => new Date(a.startDate) - new Date(b.startDate))
            .reduce((acc, item) => {
              const date = item.startDate;
              if (!acc[date]) acc[date] = [];
              acc[date].push(item);
              return acc;
            }, {}),
        ).map(([date, tasks]) => ({
          date,
          tasks,
        }));

        const priorityColors = {
          en_proceso: "#dc2626",
          no_iniciado: "#d97706",
          en_revision: "#7c3aed",
          rechazado: "#e11d48",
          finalizado: "green",
        };

        // Clave que resume el contenido relevante de las tareas, para saber cuándo refrescar eventos
        const eventsSignature = tasksWithDate
          .map((t) =>
            [
              t.id,
              t.startDate,
              t.startTime,
              t.endDate,
              t.endTime,
              t.status,
              t.priority,
              t.title,
              t.projectId,
            ].join("|"),
          )
          .join(";;");

        // Referencias siempre actualizadas para usarlas dentro de los callbacks del calendario
        // (evita tener que recrear el calendario cada vez que cambian las tareas o los filtros)
        const tasksRef = useRef(tasks);
        tasksRef.current = tasks;
        const onOpenTaskRef = useRef(onOpenTask);
        onOpenTaskRef.current = onOpenTask;
        const onCreateTaskRef = useRef(onCreateTask);
        onCreateTaskRef.current = onCreateTask;
        const filterProjectIdRef = useRef(filterProjectId);
        filterProjectIdRef.current = filterProjectId;

        // Crea la instancia de FullCalendar una sola vez
        useEffect(() => {
          if (!calendarElRef.current || !window.FullCalendar) return;

          const calendar = new window.FullCalendar.Calendar(
            calendarElRef.current,
            {
              initialView: "dayGridMonth",
              locale: "es",
              height: "auto",
              firstDay: 1,
              dayMaxEventRows: 3,
              //headerToolbar: {
              //    left: 'prev,next today',
              //    center: 'title',
              //    right: 'listMonth,dayGridMonth'
              //},
              //buttonText: { today: 'Hoy', month: 'Mes', list: 'Lista' },
              events: [],
              eventClick: (info) => {
                const clickedId = info.event.extendedProps.taskId;
                const task = (tasksRef.current || []).find(
                  (t) => t.id === clickedId,
                );
                if (task && task.startDate) setSelectedDate(task.startDate);
                if (task && onOpenTaskRef.current) onOpenTaskRef.current(task);
              },

              // Al hacer click en una fecha del calendario (fuera de una tarea puntual),
              // se abre el modal de creación de tarea con esa fecha ya seleccionada.
              // FullCalendar solo dispara dateClick cuando el click NO cae sobre un evento
              // (los clicks sobre una tarea disparan eventClick en su lugar), así que esto
              // funciona incluso en días que ya tienen tareas.
              dateClick: (info) => {
                setSelectedDate(info.dateStr);
                if (!isHelper && onCreateTaskRef.current) {
                  const proj =
                    filterProjectIdRef.current !== "all"
                      ? filterProjectIdRef.current
                      : null;
                  onCreateTaskRef.current(info.dateStr, proj);
                }
              },
            },
          );

          calendar.render();
          calendarInstanceRef.current = calendar;

          return () => {
            calendar.destroy();
            calendarInstanceRef.current = null;
          };
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        // Actualiza los eventos mostrados cada vez que cambian las tareas visibles o los filtros
        useEffect(() => {
          const calendar = calendarInstanceRef.current;
          if (!calendar) return;

          const events = tasksWithDate.map((t) => {
            const proj = projects.find((p) => p.id === t.projectId);
            const statusText = COLUMNS.filter((col) => col.id === t.status)[0][
              "title"
            ];
            const hasTime = !!t.startTime;
            const startValue = hasTime
              ? `${t.startDate}T${t.startTime}`
              : t.startDate;
            let endValue;
            if (t.endDate) {
              endValue = t.endTime ? `${t.endDate}T${t.endTime}` : t.endDate;
            }
            const timeLabel = hasTime ? ` (${t.startTime}${t.endTime ? " - " + t.endTime : ""})` : "";
            return {
              id: t.id,
              title: proj
                ? `${t.title} - ${statusText} · ${proj.name}${timeLabel}`
                : `${t.title}${timeLabel}`,
              start: startValue,
              end: endValue,
              allDay: !hasTime,
              backgroundColor:
                priorityColors[t.status] || priorityColors.no_iniciado,
              borderColor:
                priorityColors[t.status] || priorityColors.no_iniciado,
              extendedProps: { taskId: t.id },
            };
          });

          calendar.removeAllEventSources();
          calendar.addEventSource(events);
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [eventsSignature, isHelper, currentUserId]);

        return (
          <React.Fragment>
            {/* Header Superior del Calendario */}
            {!hideHeader && (
              <header className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
                <div className="flex items-center space-x-4">
                  <button
                    className="md:hidden text-slate-600 hover:text-slate-900 focus:outline-none"
                    onClick={onOpenSidebar}
                  >
                    <i data-lucide="menu" className="w-6 h-6"></i>
                  </button>
                  <div>
                    <h2 className="text-xl font-bold text-slate-800 flex items-center space-x-2">
                      <i
                        data-lucide="calendar-days"
                        className="w-5 h-5 text-indigo-600"
                      ></i>
                      <span>Calendario de Tareas</span>
                    </h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      {isHelper
                        ? "Mostrando únicamente tus tareas asignadas, en tus proyectos."
                        : "Mostrando las tareas de tus proyectos."}{" "}
                      Haz click en una fecha vacía para crear una tarea ahí.
                    </p>
                  </div>
                </div>
                <button
                  onClick={() =>
                    onCreateTaskRef.current(undefined, filterProjectId)
                  }
                  disabled={!currentUserId}
                  title={
                    !currentUserId
                      ? "Selecciona un usuario actual en la barra lateral"
                      : ""
                  }
                  className="py-2 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium rounded-lg text-sm flex items-center space-x-2 transition shadow-sm active:scale-95"
                >
                  <i data-lucide="plus-circle" className="w-4 h-4"></i>
                  <span className="hidden sm:inline">Agregar Tarea</span>
                  <span className="sm:hidden">Tarea</span>
                </button>
              </header>
            )}

            {/* Contenido del Calendario */}
            <div className="flex-1 overflow-y-auto p-3 md:p-6 flex justify-between gap-8 flex-col md:flex-row">
             
              

              <div className="md:w-8/12 md:pl-4">
                {/* Panel lateral: lista de tareas del día seleccionado en el calendario */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 sticky top-0">
                  {/* Toggle Hoy / Mensual */}
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Tareas</span>
                    <div className="flex rounded-lg border border-slate-200 overflow-hidden text-xs font-medium">
                      <button
                        type="button"
                        onClick={() => setTaskListFilter("hoy")}
                        className={`px-3 py-1.5 flex items-center gap-1.5 transition ${
                          taskListFilter === "hoy"
                            ? "bg-indigo-600 text-white"
                            : "bg-white text-slate-500 hover:bg-slate-50"
                        }`}
                      >
                        <i data-lucide="sun" className="w-3 h-3"></i>
                        Hoy
                      </button>
                      <button
                        type="button"
                        onClick={() => setTaskListFilter("mensual")}
                        className={`px-3 py-1.5 flex items-center gap-1.5 border-l border-slate-200 transition ${
                          taskListFilter === "mensual"
                            ? "bg-indigo-600 text-white"
                            : "bg-white text-slate-500 hover:bg-slate-50"
                        }`}
                      >
                        <i data-lucide="calendar" className="w-3 h-3"></i>
                        Mensual
                      </button>
                    </div>
                  </div>

                  {filteredTasksForList.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-6">
                      {taskListFilter === "hoy" ? "No hay tareas para hoy." : "No hay tareas para mostrar."}
                    </p>
                  ) : (
                    <ul className="divide-y divide-slate-300">
                      {dayTasks.map((group) => (
                        <div key={group.date} className={`mb-5`}>
                          <div
                            className=" flex items-center justify-between py-2 "
                            onClick={() =>
                              setSelectedAcordion((acor) => {
                                return !acor.includes(group.date)
                                  ? [...acor, group.date]
                                  : acor.filter((a) => a !== group.date);
                              })
                            }
                          >
                            <h3 className="text-sm font-semibold text-slate-700 mb-3 flex items-center space-x-3">
                              <i
                                data-lucide="list-checks"
                                className="w-4 h-4 text-indigo-600 mr-1"
                              ></i>
                              {new Date(group.date).toLocaleDateString(
                                "es-ES",
                                {
                                  weekday: "long",
                                  day: "numeric",
                                  month: "long",
                                  year: "numeric",
                                },
                              )}
                            </h3>
                            
                            <i
                                  data-lucide="chevron-down"
                                  className={`w-4 h-4 ${selectedAcordion.includes(group.date) || 'hidden'}`} 
                                ></i>
                            <i
                                  data-lucide="chevron-right"
                                  className={`w-4 h-4 ${!selectedAcordion.includes(group.date) || 'hidden'}`} 
                                ></i>
                          </div>

                          <ul
                            className={`rounded-b-lg overflow-hidden bg-white ${selectedAcordion.includes(group.date) || "hidden"}`}
                          >
                            {group.tasks.map((t) => {
                              const isDone = t.status === "finalizado";
                              const subtareas = t.subtareas || [];
                              const subtareasDone = subtareas.filter(s => s.status === "finalizado").length;
                              const isSubtareasExpanded = !!expandedSubtareas[t.id];

                              return (
                                <li key={t.id} className="border-b last:border-b-0 border-slate-100">
                                  <div
                                    onClick={() => onOpenTask?.(t)}
                                    className="flex items-center justify-between gap-3 px-4 py-3 hover:bg-slate-50 transition-colors cursor-pointer"
                                  >
                                  <div className="flex items-center gap-2 flex-1 min-w-0">
                                    {/* Botón acordeón para subtareas */}
                                    {subtareas.length > 0 && (
                                      <button
                                        type="button"
                                        onClick={(e) => {
                                          e.stopPropagation();
                                          setExpandedSubtareas(prev => ({
                                            ...prev,
                                            [t.id]: !prev[t.id]
                                          }));
                                        }}
                                        className="shrink-0 w-5 h-5 flex items-center justify-center rounded hover:bg-indigo-50 text-indigo-400 hover:text-indigo-600 transition"
                                        title={isSubtareasExpanded ? "Ocultar subtareas" : "Ver subtareas"}
                                      >
                                        <i data-lucide={isSubtareasExpanded ? "chevron-down" : "chevron-right"} className="w-3.5 h-3.5"></i>
                                      </button>
                                    )}
                                    {/* Espaciador cuando no hay subtareas, para alinear */}
                                    {subtareas.length === 0 && <span className="w-5 shrink-0"></span>}

                                    {t.startTime && (
                                      <span className="text-[10px] font-semibold text-indigo-600 bg-indigo-50 border border-indigo-100 rounded px-1.5 py-0.5 shrink-0">
                                        {t.startTime}
                                      </span>
                                    )}
                                    <div className="flex flex-col min-w-0">
                                      <span
                                        className={`truncate text-sm ${
                                          isDone
                                            ? "line-through text-green-600"
                                            : t.status === "rechazado"
                                              ? "text-red-500"
                                              : "text-slate-800"
                                        }`}
                                      >
                                        {t.title}
                                      </span>
                                      {subtareas.length > 0 && (
                                        <span className="text-[10px] text-slate-400 mt-0.5 flex items-center gap-0.5">
                                          <i data-lucide="list-todo" className="w-3 h-3 text-indigo-400"></i>
                                          {subtareasDone}/{subtareas.length} subtareas
                                          {subtareasDone === subtareas.length && subtareas.length > 0 && (
                                            <i data-lucide="check-circle" className="w-3 h-3 text-emerald-500 ml-0.5"></i>
                                          )}
                                        </span>
                                      )}
                                    </div>
                                  </div>

                                  {!t.needsReview  ? (
                                    // Tareas sin revisión: checkbox simple de siempre (Finalizado / No Iniciado)
                                    <>
                                      {
                                        hasFullAccess ? (
                                          COLUMNS2.map((col) => {
                                          const isSelected =
                                            t.status === col.id;
                                          return (
                                            <button
                                              key={col.id}
                                              type="button"
                                              title={col.title}
                                              onClick={(e) =>{
                                                e.stopPropagation();
                                                onSetTaskStatus?.(
                                                  t.id,
                                                  col.id,
                                                )
                                              }}
                                              className={`w-6 h-6 rounded-md flex items-center justify-center border transition ${
                                                isSelected
                                                  ? `${col.badgeBg} ${col.badgeText} border-current`
                                                  : "bg-white text-slate-500 border-slate-400 hover:text-slate-500 hover:border-slate-300"
                                              }`}
                                            >
                                              <i
                                                data-lucide={col.icon}
                                                className="w-3 h-3"
                                              ></i>
                                            </button>
                                          );
                                        })
                                        ) : (

                                          <input
                                            type="checkbox"
                                            checked={isDone}
                                            onClick={(e) => e.stopPropagation()}
                                            onChange={(e) =>
                                              onToggleTaskDone?.(
                                                t.id,
                                                e.target.checked,
                                              )
                                            }
                                            className="h-5 w-5 shrink-0 rounded border-2 border-indigo-500 text-indigo-600 focus:ring-indigo-500 accent-indigo-500 rounded-sm"
                                          />
                                        )
                                      }
                                    </>

                                  ) : hasFullAccess ? (
                                    // Admin/Desarrollador con tarea que necesita revisión:
                                    // si está "En Revisión" solo puede Aceptar o Rechazar; si no,
                                    // puede elegir cualquiera de los 5 estados directamente.
                                    <div
                                      className="flex items-center gap-1 shrink-0"
                                      onClick={(e) => e.stopPropagation()}
                                    >
                                      {t.status === "en_revision" ? (
                                        <>
                                          <button
                                            type="button"
                                            title="Aprobar"
                                            onClick={() =>
                                              onSetTaskStatus?.(
                                                t.id,
                                                "finalizado",
                                              )
                                            }
                                            className="p-1.5 rounded-md bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border border-emerald-200 transition"
                                          >
                                            <i
                                              data-lucide="check"
                                              className="w-3.5 h-3.5"
                                            ></i>
                                          </button>
                                          <button
                                            type="button"
                                            title="Rechazar"
                                            onClick={() =>
                                              onSetTaskStatus?.(
                                                t.id,
                                                "rechazado",
                                              )
                                            }
                                            className="p-1.5 rounded-md bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 transition"
                                          >
                                            <i
                                              data-lucide="x"
                                              className="w-3.5 h-3.5"
                                            ></i>
                                          </button>
                                        </>
                                      ) : (
                                        COLUMNS.map((col) => {
                                          const isSelected =
                                            t.status === col.id;
                                          return (
                                            <button
                                              key={col.id}
                                              type="button"
                                              title={col.title}
                                              onClick={() =>
                                                onSetTaskStatus?.(
                                                  t.id,
                                                  col.id,
                                                )
                                              }
                                              className={`w-6 h-6 rounded-md flex items-center justify-center border transition ${
                                                isSelected
                                                  ? `${col.badgeBg} ${col.badgeText} border-current`
                                                  : "bg-white text-slate-500 border-slate-500 hover:text-slate-500 hover:border-slate-300"
                                              }`}
                                            >
                                              <i
                                                data-lucide={col.icon}
                                                className="w-3 h-3"
                                              ></i>
                                            </button>
                                          );
                                        })
                                      )}
                                    </div>
                                  ) : t.status === "en_revision" ? (
                                    // Ayudante: la tarea que él mismo envió está esperando aprobación
                                    <div
                                      className="flex items-center gap-1.5 shrink-0"
                                      onClick={(e) => e.stopPropagation()}
                                    >
                                      <span className="text-[10px] font-medium text-violet-600 bg-violet-50 border border-violet-100 px-2 py-1 rounded whitespace-nowrap">
                                        En revisión
                                      </span>
                                      <button
                                        type="button"
                                        onClick={() =>
                                          onSetTaskStatus?.(
                                            t.id,
                                            "en_proceso",
                                          )
                                        }
                                        className="text-[10px] text-slate-400 hover:text-red-500 underline whitespace-nowrap"
                                      >
                                        Cancelar
                                      </button>
                                    </div>
                                  ) : t.status === "finalizado" ? (
                                    <span className="text-[10px] font-medium text-emerald-700 bg-emerald-50 border border-emerald-100 px-2 py-1 rounded shrink-0 whitespace-nowrap">
                                      Finalizado
                                    </span>
                                  ) : t.status === "rechazado" ? (
                                    <span className="text-[10px] font-medium text-red-700 bg-red-50 border border-red-100 px-2 py-1 rounded shrink-0 whitespace-nowrap">
                                      Rechazado
                                    </span>
                                  ) : (
                                    // Ayudante: aún no envió la tarea a revisión
                                    <input
                                      type="checkbox"
                                      checked={false}
                                      onClick={(e) => e.stopPropagation()}
                                      onChange={(e) =>
                                        e.target.checked &&
                                        onSetTaskStatus?.(t.id, "en_revision")
                                      }
                                      className="h-5 w-5 shrink-0 rounded border-2 border-violet-500 text-violet-600 focus:ring-violet-500 accent-violet-500 rounded-sm"
                                    />
                                  )}
                                  </div>

                                  {/* Subtareas de la tarea, inline en la lista - acordeón */}
                                  {subtareas.length > 0 && isSubtareasExpanded && (
                                    <ul className="ml-10 mr-4 mb-2 space-y-1">
                                      {subtareas.map((st) => (
                                        <li
                                          key={st.id}
                                          className="flex items-center gap-2 px-2 py-1 rounded hover:bg-indigo-50 transition-colors"
                                          onClick={(e) => e.stopPropagation()}
                                        >
                                          <input
                                            type="checkbox"
                                            checked={st.status === "finalizado"}
                                            onChange={(e) => {
                                              e.stopPropagation();
                                              const newStatus = e.target.checked ? "finalizado" : "no_iniciado";
                                              onToggleSubtarea && onToggleSubtarea(t.id, st.id, newStatus);
                                            }}
                                            className="h-3.5 w-3.5 shrink-0 rounded border-slate-300 text-indigo-600 accent-indigo-500"
                                          />
                                          <span className={`text-xs flex-1 truncate ${st.status === "finalizado" ? "line-through text-slate-400" : "text-slate-600"}`}>
                                            {st.title}
                                          </span>
                                        </li>
                                      ))}
                                    </ul>
                                  )}
                                </li>
                              );
                            })}
                          </ul>
                        </div>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
               <div className="space-y-4 md:w-4/12">
                {!window.FullCalendar ? (
                  <div className="bg-amber-50 border border-amber-200 rounded-lg p-4 text-sm text-amber-700">
                    No se pudo cargar la librería de calendario (FullCalendar).
                    Verifica tu conexión a internet e intenta recargar la
                    página.
                  </div>
                ) : (
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
                    <div ref={calendarElRef}></div>
                  </div>
                )}

                {tasksWithoutDate.length > 0 && (
                  <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-700 flex items-center space-x-2">
                    <i
                      data-lucide="alert-triangle"
                      className="w-4 h-4 shrink-0"
                    ></i>
                    <span>
                      {tasksWithoutDate.length} tarea(s) sin fecha de inicio
                      definida no se muestran en el calendario.
                    </span>
                  </div>
                )}

                {tasksWithDate.length === 0 &&
                  tasksWithoutDate.length === 0 && (
                    <div className="text-center py-16 text-slate-400 text-sm">
                      No hay tareas para mostrar en el calendario todavía.
                    </div>
                  )}
              </div>
            </div>
          </React.Fragment>
        );
      }

      function App() {
        const [projects, setProjects] = useState(() => {
          const saved = localStorage.getItem("kanban_projects");
          return saved ? JSON.parse(saved) : INITIAL_PROJECTS;
        });

        const [tasks, setTasks] = useState(() => {
          const saved = localStorage.getItem("kanban_tasks");
          return saved ? JSON.parse(saved) : INITIAL_TASKS;
        });

        const [modules, setModules] = useState(() => {
          const saved = localStorage.getItem("kanban_modules");
          return saved ? JSON.parse(saved) : INITIAL_MODULES;
        });

        const [users, setUsers] = useState(() => {
          const saved = localStorage.getItem("kanban_users");
          return saved ? JSON.parse(saved) : INITIAL_USERS;
        });

        const [incidents, setIncidents] = useState(() => {
          const saved = localStorage.getItem("kanban_incidents");
          return saved ? JSON.parse(saved) : INITIAL_INCIDENTS;
        });

        const [currentUserId, setCurrentUserId] = useState(() => {
          return localStorage.getItem("kanban_current_user") || "";
        });

        const [activeProjectId, setActiveProjectId] = useState(() => {
          return projects.length > 0 ? projects[0].id : null;
        });

        const [activeModuleId, setActiveModuleId] = useState("all");
        const [expandedProjects, setExpandedProjects] = useState({});

        // Vista activa del panel principal: 'kanban' (Tablero) o 'incidencias'
        const [activeView, setActiveView] = useState("calendario");

        // Modales y estados de edición
        const [isProjectModalOpen, setIsProjectModalOpen] = useState(false);
        const [editingProject, setEditingProject] = useState(null); // null para crear, objeto para editar
        const [projectNameInput, setProjectNameInput] = useState("");
        // Usuarios con permiso para VER el proyecto. Si un usuario no está aquí, el proyecto
        // no aparecerá en su barra lateral ni podrá ser seleccionado al asignar tareas.
        const [projectMemberUserIds, setProjectMemberUserIds] = useState([]);
        const [deletingProject, setDeletingProject] = useState(null); // Proyecto pendiente de eliminar

        // Enlaces del proyecto (nombre + URL), cada uno puede asignarse a uno o varios
        // empleados que tengan acceso al proyecto. Se editan dentro del modal de Proyecto
        // y se muestran luego en la pestaña "Enlaces" del tablero.
        const [projectLinks, setProjectLinks] = useState([]);
        const [linkNameInput, setLinkNameInput] = useState("");
        const [linkUrlInput, setLinkUrlInput] = useState("");

        // Sección principal visible: 'proyecto' (tablero/incidencias/calendario del proyecto activo) o 'calendario' (vista global)
        // Por defecto se muestra el modo Proyecto al cargar la aplicación (con su pestaña Calendario activa).
        const [mainSection, setMainSection] = useState("proyecto");

        // Filtros del Calendario (elevados a App para poder controlarlos desde el sidebar)
        const [calendarFilterProjectId, setCalendarFilterProjectId] =
          useState("all");
        const [calendarFilterUserId, setCalendarFilterUserId] = useState("all");
        const [calendarFilterModuleId, setCalendarFilterModuleId] =
          useState("all");

        // Filtro de usuario del Calendario embebido dentro de un proyecto (pestaña "Calendario"
        // del tablero). El proyecto queda fijo al proyecto activo y el módulo se toma directamente
        // del filtro de módulo del sidebar (activeModuleId), por eso aquí solo hace falta el de usuario.
        const [projectCalendarFilterUserId, setProjectCalendarFilterUserId] =
          useState("all");

        // Modales de módulos
        const [isModuleModalOpen, setIsModuleModalOpen] = useState(false);
        const [editingModule, setEditingModule] = useState(null);
        const [moduleNameInput, setModuleNameInput] = useState("");
        const [targetProjectIdForModule, setTargetProjectIdForModule] =
          useState(null);
        const [deletingModule, setDeletingModule] = useState(null);

        const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
        const [editingTask, setEditingTask] = useState(null);
        const [taskFormData, setTaskFormData] = useState({
          title: "",
          description: "",
          status: "no_iniciado",
          priority: "media",
          moduleId: "",
          assignedUserIds: [],
          startDate: "",
          startTime: "",
          endDate: "",
          endTime: "",
          needsReview: false,
          subtareas: [],
        });
        const [subtareaInput, setSubtareaInput] = useState("");
        // Controla si se muestran los campos de fecha/hora de fin en el formulario de tarea
        const [showEndDate, setShowEndDate] = useState(false);

        // Modal de detalle (solo lectura) de tarea
        const [viewingTask, setViewingTask] = useState(null);

        // Modales de Usuarios
        const [isUsersListModalOpen, setIsUsersListModalOpen] = useState(false);
        const [isUserModalOpen, setIsUserModalOpen] = useState(false);
        const [editingUser, setEditingUser] = useState(null);
        const [userFormData, setUserFormData] = useState({
          name: "",
          role: "",
        });
        const [deletingUser, setDeletingUser] = useState(null);

        // Modales de Incidencias
        const [isIncidentModalOpen, setIsIncidentModalOpen] = useState(false);
        const [editingIncident, setEditingIncident] = useState(null);
        const [incidentFormData, setIncidentFormData] = useState({
          titulo: "",
          descripcion: "",
          prioridad: "media",
          estado: "abierta",
        });
        const [deletingIncident, setDeletingIncident] = useState(null);

        // Modales de Gestión de LocalStorage
        const [isStorageModalOpen, setIsStorageModalOpen] = useState(false);
        const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);
        const [storageMessage, setStorageMessage] = useState(null);

        // Menú lateral móvil
        const [isSidebarOpen, setIsSidebarOpen] = useState(false);

        // Filtro Hoy / Mensual del Kanban
        const [kanbanTaskFilter, setKanbanTaskFilter] = useState("mensual");

        // Drag and Drop
        const [draggedTaskId, setDraggedTaskId] = useState(null);
        const [dragOverColumn, setDragOverColumn] = useState(null);

        useEffect(() => {
          localStorage.setItem("kanban_projects", JSON.stringify(projects));
        }, [projects]);

        useEffect(() => {
          localStorage.setItem("kanban_tasks", JSON.stringify(tasks));
        }, [tasks]);

        useEffect(() => {
          localStorage.setItem("kanban_modules", JSON.stringify(modules));
        }, [modules]);

        useEffect(() => {
          localStorage.setItem("kanban_users", JSON.stringify(users));
        }, [users]);

        useEffect(() => {
          localStorage.setItem("kanban_incidents", JSON.stringify(incidents));
        }, [incidents]);

        useEffect(() => {
          localStorage.setItem("kanban_current_user", currentUserId || "");
        }, [currentUserId]);

        // Si el usuario actual seleccionado fue eliminado, deselecciona
        useEffect(() => {
          if (currentUserId && !users.some((u) => u.id === currentUserId)) {
            setCurrentUserId("");
          }
        }, [users, currentUserId]);

        // Usuario actual y permisos derivados de su rol
        const currentUser = users.find((u) => u.id === currentUserId) || null;
        const currentUserRole = currentUser ? currentUser.role : "";
        const hasFullAccess = isFullAccessRole(currentUserRole); // Admin / Desarrollador: ven todo
        const isHelper = isHelperRole(currentUserRole); // Ayudante: acceso restringido

        // Devuelve las <option> a renderizar en cualquier selector de Estado de una tarea.
        // Si la tarea NO necesita revisión: solo No Iniciado / En Proceso / Finalizado.
        // Si SÍ necesita revisión: agrega En Revisión, y Rechazado/Finalizado quedan
        // deshabilitados para quien no sea Admin o Desarrollador (solo ellos aprueban o
        // rechazan, idealmente usando los botones dedicados de "Aprobar"/"Rechazar").
        const renderTaskStatusOptions = (needsReview) => (
          <>
            <option value="no_iniciado">No Iniciado</option>
            <option value="en_proceso">En Proceso</option>
            {needsReview && (
              <option value="en_revision">En Revisión</option>
            )}
            {needsReview ? (
              <>
                <option value="rechazado" disabled={!hasFullAccess}>
                  {hasFullAccess
                    ? "Rechazado"
                    : "Rechazado (solo Admin/Desarrollador)"}
                </option>
                <option value="finalizado" disabled={!hasFullAccess}>
                  {hasFullAccess
                    ? "Finalizado (Aprobado)"
                    : "Finalizado (solo Admin/Desarrollador)"}
                </option>
              </>
            ) : (
              <option value="finalizado">Finalizado</option>
            )}
          </>
        );

        // Proyectos visibles: SIN IMPORTAR EL ROL (Admin, Desarrollador o Ayudante), un usuario
        // solo ve los proyectos donde fue agregado explícitamente como miembro
        // (project.memberUserIds). Si no está agregado, el proyecto no aparece para él.
        const visibleProjects = projects.filter((p) =>
          (p.memberUserIds || []).includes(currentUserId),
        );
        const visibleProjectIds = visibleProjects.map((p) => p.id);

        // Si el proyecto activo deja de ser visible para el usuario actual (p. ej. al cambiar de
        // usuario, si lo quitaron de los miembros, o si el proyecto fue eliminado), redirige
        // al primer proyecto visible
        const visibleProjectsSignature = visibleProjectIds.join(",");
        useEffect(() => {
          if (activeProjectId && !visibleProjectIds.includes(activeProjectId)) {
            setActiveProjectId(
              visibleProjects.length > 0 ? visibleProjects[0].id : null,
            );
          }
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [currentUserId, activeProjectId, visibleProjectsSignature]);

        // Exportar datos de LocalStorage a un archivo JSON
        const handleExportData = () => {
          const data = {
            version: "1.1",
            exportDate: new Date().toISOString(),
            projects,
            modules,
            tasks,
            users,
            incidents,
          };
          const jsonStr = JSON.stringify(data, null, 2);
          const blob = new Blob([jsonStr], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `kanban_backup_${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setStorageMessage("Copia de seguridad exportada con éxito.");
        };

        // Importar datos desde archivo JSON a LocalStorage
        const handleImportData = (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (
                Array.isArray(imported.projects) &&
                Array.isArray(imported.tasks) &&
                Array.isArray(imported.modules)
              ) {
                setProjects(imported.projects);
                setModules(imported.modules);
                setTasks(imported.tasks);
                setUsers(Array.isArray(imported.users) ? imported.users : []);
                setIncidents(
                  Array.isArray(imported.incidents) ? imported.incidents : [],
                );
                if (imported.projects.length > 0) {
                  setActiveProjectId(imported.projects[0].id);
                }
                setStorageMessage(
                  "¡Datos importados y guardados en LocalStorage correctamente!",
                );
                setIsStorageModalOpen(false);
              } else {
                setStorageMessage(
                  "El archivo importado no tiene la estructura válida.",
                );
              }
            } catch (err) {
              setStorageMessage("Error al leer el archivo JSON.");
            }
          };
          reader.readAsText(file);
        };

        // Restablecer y borrar datos del LocalStorage
        const confirmResetAllData = () => {
          localStorage.removeItem("kanban_projects");
          localStorage.removeItem("kanban_tasks");
          localStorage.removeItem("kanban_modules");
          localStorage.removeItem("kanban_users");
          localStorage.removeItem("kanban_incidents");
          localStorage.removeItem("kanban_current_user");
          setProjects([]);
          setTasks([]);
          setModules([]);
          setUsers([]);
          setIncidents([]);
          setCurrentUserId("");
          setActiveProjectId(null);
          setActiveModuleId("all");
          setActiveView("kanban");
          setIsResetConfirmOpen(false);
          setIsStorageModalOpen(false);
          setStorageMessage(
            "Se han eliminado todos los datos del LocalStorage.",
          );
        };

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        });

        // Al cambiar de proyecto activo, resetea el módulo seleccionado a "all" y expande el proyecto
        useEffect(() => {
          setActiveModuleId("all");
          if (activeProjectId) {
            setExpandedProjects((prev) => ({
              ...prev,
              [activeProjectId]: true,
            }));
          }
          // También resetea el filtro de usuario de la pestaña Calendario del proyecto
          setProjectCalendarFilterUserId("all");
        }, [activeProjectId]);

        const toggleProjectExpansion = (projId, e) => {
          if (e) e.stopPropagation();
          setExpandedProjects((prev) => ({ ...prev, [projId]: !prev[projId] }));
        };

        // Selecciona un proyecto desde el sidebar: activa el proyecto, sincroniza los filtros
        // del Calendario para que muestren ese proyecto (todas sus tareas) y lleva a la vista
        // de Calendario, que es la que se debe mostrar primero.
        const selectProjectFromSidebar = (projId) => {
          setActiveProjectId(projId);
          setActiveModuleId("all");
          setCalendarFilterProjectId(projId);
          setCalendarFilterUserId("all");
          setCalendarFilterModuleId("all");
          //setMainSection('proyecto');
          setIsSidebarOpen(false);
        };

        // Selecciona un módulo específico desde el sidebar: activa el proyecto y módulo,
        // sincroniza los filtros del Calendario a ese proyecto y módulo, y lleva a la vista
        // de Calendario para mostrar únicamente las tareas de ese módulo.
        const selectModuleFromSidebar = (projId, modId) => {
          setActiveProjectId(projId);
          setActiveModuleId(modId);
          setCalendarFilterProjectId(projId);
          setCalendarFilterUserId("all");
          setCalendarFilterModuleId(modId);
          //setMainSection('proyecto');
          setIsSidebarOpen(false);
        };

        const openModuleModal = (projId, module = null, e = null) => {
          if (e) e.stopPropagation();
          setTargetProjectIdForModule(projId);
          if (module) {
            setEditingModule(module);
            setModuleNameInput(module.name);
          } else {
            setEditingModule(null);
            setModuleNameInput("");
          }
          setIsModuleModalOpen(true);
        };

        const handleSaveModule = (e) => {
          e.preventDefault();
          if (!moduleNameInput.trim() || !targetProjectIdForModule) return;

          if (editingModule) {
            setModules(
              modules.map((m) =>
                m.id === editingModule.id
                  ? { ...m, name: moduleNameInput.trim() }
                  : m,
              ),
            );
          } else {
            const newMod = {
              id: "mod-" + Date.now(),
              projectId: targetProjectIdForModule,
              name: moduleNameInput.trim(),
            };
            setModules([...modules, newMod]);
          }
          setIsModuleModalOpen(false);
          setModuleNameInput("");
        };

        const confirmDeleteModule = () => {
          if (!deletingModule) return;
          setModules(modules.filter((m) => m.id !== deletingModule.id));
          // Desvincular tareas asignadas a este módulo (pasan a sin módulo)
          setTasks(
            tasks.map((t) =>
              t.moduleId === deletingModule.id ? { ...t, moduleId: "" } : t,
            ),
          );
          if (activeModuleId === deletingModule.id) {
            setActiveModuleId("all");
          }
          setDeletingModule(null);
        };

        // --- Gestión de Usuarios ---
        const openUserModal = (user = null) => {
          if (user) {
            setEditingUser(user);
            setUserFormData({ name: user.name, role: user.role || "" });
          } else {
            setEditingUser(null);
            setUserFormData({ name: "", role: "" });
          }
          setIsUserModalOpen(true);
        };

        const handleSaveUser = (e) => {
          e.preventDefault();
          if (!userFormData.name.trim() || !userFormData.role.trim()) return;

          if (editingUser) {
            setUsers(
              users.map((u) =>
                u.id === editingUser.id
                  ? {
                      ...u,
                      name: userFormData.name.trim(),
                      role: userFormData.role.trim(),
                    }
                  : u,
              ),
            );
          } else {
            const newUser = {
              id: "user-" + Date.now(),
              name: userFormData.name.trim(),
              role: userFormData.role.trim(),
            };
            setUsers([...users, newUser]);
            // Si no hay usuario actual seleccionado, se asigna automáticamente el recién creado
            if (!currentUserId) {
              setCurrentUserId(newUser.id);
            }
          }
          setIsUserModalOpen(false);
          setUserFormData({ name: "", role: "" });
        };

        const confirmDeleteUser = () => {
          if (!deletingUser) return;
          setUsers(users.filter((u) => u.id !== deletingUser.id));
          // Quita al usuario de las tareas asignadas y del campo "creado por"
          setTasks(
            tasks.map((t) => ({
              ...t,
              assignedUserIds: (t.assignedUserIds || []).filter(
                (id) => id !== deletingUser.id,
              ),
              createdBy: t.createdBy === deletingUser.id ? "" : t.createdBy,
            })),
          );
          // Quita al usuario de las incidencias reportadas
          setIncidents(
            incidents.map((i) =>
              i.reportadoId === deletingUser.id ? { ...i, reportadoId: "" } : i,
            ),
          );
          // Quita al usuario de la lista de miembros con acceso a los proyectos
          setProjects(
            projects.map((p) => ({
              ...p,
              memberUserIds: (p.memberUserIds || []).filter(
                (id) => id !== deletingUser.id,
              ),
            })),
          );
          setDeletingUser(null);
        };

        const openProjectModal = (project = null) => {
          if (project) {
            setEditingProject(project);
            setProjectNameInput(project.name);
            setProjectMemberUserIds(project.memberUserIds || []);
            setProjectLinks(project.links || []);
          } else {
            setEditingProject(null);
            setProjectNameInput("");
            // Se preselecciona al usuario actual como miembro para que no pierda
            // acceso al proyecto que está creando (puede desmarcarse si lo desea).
            setProjectMemberUserIds(currentUserId ? [currentUserId] : []);
            setProjectLinks([]);
          }
          setLinkNameInput("");
          setLinkUrlInput("");
          setIsProjectModalOpen(true);
        };

        // Alterna si un usuario tiene acceso (puede ver) el proyecto que se está creando/editando
        const toggleProjectMember = (userId) => {
          setProjectMemberUserIds((prev) => {
            const next = prev.includes(userId)
              ? prev.filter((id) => id !== userId)
              : [...prev, userId];
            // Si un usuario pierde el acceso al proyecto, también se le quita de
            // cualquier enlace al que estuviera asignado.
            if (prev.includes(userId)) {
              setProjectLinks((links) =>
                links.map((l) => ({
                  ...l,
                  assignedUserIds: (l.assignedUserIds || []).filter(
                    (id) => id !== userId,
                  ),
                })),
              );
            }
            return next;
          });
        };

        // Agrega un nuevo enlace (nombre + URL) al proyecto que se está creando/editando
        const addProjectLink = () => {
          const name = linkNameInput.trim();
          let url = linkUrlInput.trim();
          if (!name || !url) return;
          // Antepone https:// si el usuario no incluyó un protocolo, para que el enlace
          // funcione correctamente al abrirse.
          if (!/^https?:\/\//i.test(url)) {
            url = "https://" + url;
          }
          setProjectLinks((prev) => [
            ...prev,
            { id: "link-" + Date.now(), name, url, assignedUserIds: [] },
          ]);
          setLinkNameInput("");
          setLinkUrlInput("");
        };

        // Elimina un enlace del proyecto que se está creando/editando
        const removeProjectLink = (linkId) => {
          setProjectLinks((prev) => prev.filter((l) => l.id !== linkId));
        };

        // Asigna/desasigna un empleado (usuario con acceso al proyecto) a un enlace específico
        const toggleLinkAssignee = (linkId, userId) => {
          setProjectLinks((prev) =>
            prev.map((l) =>
              l.id === linkId
                ? {
                    ...l,
                    assignedUserIds: (l.assignedUserIds || []).includes(
                      userId,
                    )
                      ? l.assignedUserIds.filter((id) => id !== userId)
                      : [...(l.assignedUserIds || []), userId],
                  }
                : l,
            ),
          );
        };

        const handleSaveProject = (e) => {
          e.preventDefault();
          if (!projectNameInput.trim()) return;

          // Se garantiza que el usuario actual quede siempre como miembro del proyecto
          // que está creando o editando, para que no se quede sin poder verlo por accidente.
          const finalMemberUserIds = currentUserId
            ? Array.from(new Set([...projectMemberUserIds, currentUserId]))
            : projectMemberUserIds;

          if (editingProject) {
            setProjects(
              projects.map((p) =>
                p.id === editingProject.id
                  ? {
                      ...p,
                      name: projectNameInput.trim(),
                      memberUserIds: finalMemberUserIds,
                      links: projectLinks,
                    }
                  : p,
              ),
            );
          } else {
            const newProj = {
              id: "proj-" + Date.now(),
              name: projectNameInput.trim(),
              memberUserIds: finalMemberUserIds,
              links: projectLinks,
            };
            setProjects([...projects, newProj]);
            setActiveProjectId(newProj.id);
          }
          setIsProjectModalOpen(false);
          setProjectNameInput("");
          setProjectMemberUserIds([]);
          setProjectLinks([]);
          setLinkNameInput("");
          setLinkUrlInput("");
        };

        const confirmDeleteProject = () => {
          if (!deletingProject) return;
          setProjects(projects.filter((p) => p.id !== deletingProject.id));
          setTasks(tasks.filter((t) => t.projectId !== deletingProject.id));
          setModules(modules.filter((m) => m.projectId !== deletingProject.id));
          setDeletingProject(null);
        };

        const openTaskModal = (
          task = null,
          defaultStatus = "no_iniciado",
          overrides = {},
        ) => {
          if (task) {
            // Si la tarea pertenece a otro proyecto (p. ej. se abrió desde el Calendario),
            // sincroniza el proyecto activo para que el módulo y los usuarios asignables
            // que se muestran correspondan al proyecto correcto.
            if (task.projectId && task.projectId !== activeProjectId) {
              setActiveProjectId(task.projectId);
            }
            setEditingTask(task);
            setTaskFormData({
              title: task.title,
              description: task.description || "",
              status: task.status,
              priority: task.priority || "media",
              projectId: task.projectId || "",
              moduleId: task.moduleId || "",
              assignedUserIds: task.assignedUserIds || [],
              startDate: task.startDate || "",
              startTime: task.startTime || "",
              endDate: task.endDate || "",
              endTime: task.endTime || "",
              needsReview: !!task.needsReview,
              subtareas: task.subtareas || [],
            });
            setSubtareaInput("");
            setShowEndDate(!!task.endDate);
          } else {
            // Proyecto por defecto para la nueva tarea: el indicado explícitamente
            // (p. ej. desde el filtro del Calendario), si no el proyecto activo del
            // tablero Kanban, y si tampoco hay, el primer proyecto visible del usuario.
            const defaultProjectId =
              overrides.projectId ||
              activeProjectId ||
              visibleProjects[0]?.id ||
              "";
            const lockedModule =
              activeModuleId !== "all" && defaultProjectId === activeProjectId
                ? activeModuleId
                : "";
            setEditingTask(null);
            setSubtareaInput("");
            setTaskFormData({
              title: "",
              description: "",
              status: defaultStatus,
              priority: "media",
              projectId: defaultProjectId,
              // Si está filtrado por módulo específico dentro del mismo proyecto activo, se auto-asigna dicho módulo
              moduleId: lockedModule,
              assignedUserIds: [],
              subtareas: [],
              // Por defecto, la fecha de inicio es hoy, salvo que venga indicada (p. ej. click en el Calendario)
              startDate:
                overrides.startDate || new Date().toISOString().slice(0, 10),
              startTime: "",
              endDate: "",
              endTime: "",
              // Si la tarea se crea directamente en una columna de revisión/rechazo,
              // se asume que necesita revisión.
              needsReview: REVIEW_ONLY_STATUSES.includes(defaultStatus),
            });
            setShowEndDate(false);
          }
          setIsTaskModalOpen(true);
        };

        // Cambia el proyecto seleccionado dentro del formulario de nueva tarea, reseteando
        // el módulo y los usuarios asignados ya que pertenecían al proyecto anterior.
        const handleTaskProjectChange = (projectId) => {
          setTaskFormData((prev) => ({
            ...prev,
            projectId,
            moduleId: "",
            assignedUserIds: [],
          }));
        };

        // Alterna la asignación de un usuario dentro del formulario de tarea
        const toggleAssignedUser = (userId) => {
          setTaskFormData((prev) => {
            const current = prev.assignedUserIds || [];
            const exists = current.includes(userId);
            return {
              ...prev,
              assignedUserIds: exists
                ? current.filter((id) => id !== userId)
                : [...current, userId],
            };
          });
        };

        const handleSaveTask = (e) => {
          e.preventDefault();
          // El proyecto de la tarea: si se edita, es el de la tarea original (no cambia);
          // si es nueva, es el elegido en el formulario (por defecto el proyecto activo).
          const resolvedProjectId = editingTask
            ? editingTask.projectId
            : taskFormData.projectId;
          if (!taskFormData.title.trim() || !resolvedProjectId) return;

          // El módulo se bloquea al módulo activo solo cuando la tarea pertenece al
          // proyecto actualmente activo en el tablero Kanban y hay un módulo filtrado;
          // en cualquier otro caso (p. ej. creación desde el Calendario) se respeta el
          // módulo elegido explícitamente en el formulario.
          const lockModuleToActive =
            activeModuleId !== "all" && resolvedProjectId === activeProjectId;
          const assignedModuleId = lockModuleToActive
            ? activeModuleId
            : taskFormData.moduleId;

          // Los campos de fecha/hora de fin solo se guardan si el usuario activó la
          // opción "Agregar fecha de fin"; de lo contrario se limpian.
          const resolvedEndDate = showEndDate ? taskFormData.endDate || "" : "";
          const resolvedEndTime = showEndDate ? taskFormData.endTime || "" : "";

          // Si la tarea no necesita revisión, nunca debe quedar en un estado que
          // solo tiene sentido dentro del flujo de revisión (por si el estado
          // quedó desincronizado al desmarcar la opción).
          const resolvedStatus =
            !taskFormData.needsReview &&
            REVIEW_ONLY_STATUSES.includes(taskFormData.status)
              ? "en_proceso"
              : taskFormData.status;

          if (editingTask) {
            setTasks(
              tasks.map((t) =>
                t.id === editingTask.id
                  ? {
                      ...t,
                      ...taskFormData,
                      status: resolvedStatus,
                      projectId: resolvedProjectId,
                      title: taskFormData.title.trim(),
                      moduleId: assignedModuleId,
                      assignedUserIds: taskFormData.assignedUserIds || [],
                      startDate: taskFormData.startDate || "",
                      startTime: taskFormData.startTime || "",
                      endDate: resolvedEndDate,
                      endTime: resolvedEndTime,
                      needsReview: !!taskFormData.needsReview,
                      subtareas: taskFormData.subtareas || [],
                    }
                  : t,
              ),
            );
          } else {
            const newTask = {
              id: "task-" + Date.now(),
              projectId: resolvedProjectId,
              title: taskFormData.title.trim(),
              description: taskFormData.description.trim(),
              status: resolvedStatus,
              priority: taskFormData.priority,
              moduleId: assignedModuleId,
              assignedUserIds: taskFormData.assignedUserIds || [],
              startDate: taskFormData.startDate || "",
              startTime: taskFormData.startTime || "",
              endDate: resolvedEndDate,
              endTime: resolvedEndTime,
              needsReview: !!taskFormData.needsReview,
              subtareas: taskFormData.subtareas || [],
              createdBy: currentUserId || "",
            };
            setTasks([...tasks, newTask]);
          }
          setIsTaskModalOpen(false);
        };

        const handleDeleteTask = (taskId) => {
          setTasks(tasks.filter((t) => t.id !== taskId));
        };

        // Alterna el estado de una subtarea dentro de la tarea padre
        const handleToggleSubtarea = (taskId, subtareaId, newStatus) => {
          setTasks(
            tasks.map((t) => {
              if (t.id !== taskId) return t;
              return {
                ...t,
                subtareas: (t.subtareas || []).map((st) =>
                  st.id === subtareaId ? { ...st, status: newStatus } : st,
                ),
              };
            }),
          );
        };

        // Marca una tarea como Finalizada/En Revisión o la devuelve a No Iniciado, usado
        // por el checkbox del panel lateral de "Tareas de este día" en el Calendario.
        // Si la tarea necesita revisión, marcarla como hecha la envía a "En Revisión"
        // en vez de darla directamente por Finalizada.
        const handleToggleTaskDone = (taskId, done) => {
          setTasks(
            tasks.map((t) => {
              if (t.id !== taskId) return t;
              if (!done) return { ...t, status: "no_iniciado" };
              return { ...t, status: t.needsReview ? "en_revision" : "finalizado" };
            }),
          );
        };

        // Setter genérico de estado de una tarea (usado por los controles de estado
        // del panel de Calendario: checkbox de Ayudante, botones de Admin/Desarrollador).
        const handleSetTaskStatus = (taskId, status) => {
          setTasks(
            tasks.map((t) => (t.id === taskId ? { ...t, status } : t)),
          );
        };

        // Aprobar/Rechazar una tarea que está "En Revisión". Solo deberían invocarse
        // desde controles visibles para Admin o Desarrollador (hasFullAccess).
        const handleApproveTask = (taskId) => {
          setTasks(
            tasks.map((t) =>
              t.id === taskId ? { ...t, status: "finalizado" } : t,
            ),
          );
        };

        const handleRejectTask = (taskId) => {
          setTasks(
            tasks.map((t) =>
              t.id === taskId ? { ...t, status: "rechazado" } : t,
            ),
          );
        };

        const handleDragStart = (e, taskId) => {
          setDraggedTaskId(taskId);
          e.dataTransfer.setData("text/plain", taskId);
          e.dataTransfer.effectAllowed = "move";
        };

        const handleDragOver = (e, columnId) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          if (dragOverColumn !== columnId) {
            setDragOverColumn(columnId);
          }
        };

        const handleDragLeave = (columnId) => {
          if (dragOverColumn === columnId) {
            setDragOverColumn(null);
          }
        };

        const handleDrop = (e, targetStatus) => {
          e.preventDefault();
          setDragOverColumn(null);
          if (!draggedTaskId) return;

          const draggedTask = tasks.find((t) => t.id === draggedTaskId);
          if (draggedTask) {
            // Las tareas que necesitan revisión no pueden arrastrarse directo a
            // Finalizado/Rechazado: esos estados solo se asignan aprobando o
            // rechazando desde "En Revisión" (ver handleApproveTask/handleRejectTask).
            // Las tareas que NO necesitan revisión nunca pasan por esos dos estados.
            const allowedTargets = draggedTask.needsReview
              ? ["no_iniciado", "en_proceso", "en_revision"]
              : ["no_iniciado", "en_proceso", "finalizado"];
            if (!allowedTargets.includes(targetStatus)) {
              setDraggedTaskId(null);
              return;
            }
          }

          setTasks(
            tasks.map((t) => {
              if (t.id === draggedTaskId) {
                return { ...t, status: targetStatus };
              }
              return t;
            }),
          );
          setDraggedTaskId(null);
        };

        // --- Gestión de Incidencias ---
        // Las incidencias están asociadas únicamente al proyecto activo, no a un
        // módulo en particular.
        const openIncidentModal = (incident = null) => {
          if (incident) {
            setEditingIncident(incident);
            setIncidentFormData({
              titulo: incident.titulo,
              descripcion: incident.descripcion || "",
              prioridad: incident.prioridad || "media",
              estado: incident.estado || "abierta",
            });
          } else {
            setEditingIncident(null);
            setIncidentFormData({
              titulo: "",
              descripcion: "",
              prioridad: "media",
              estado: "abierta",
            });
          }
          setIsIncidentModalOpen(true);
        };

        const handleSaveIncident = (e) => {
          e.preventDefault();
          if (!incidentFormData.titulo.trim()) return;

          if (editingIncident) {
            setIncidents(
              incidents.map((i) =>
                i.id === editingIncident.id
                  ? {
                      ...i,
                      ...incidentFormData,
                      titulo: incidentFormData.titulo.trim(),
