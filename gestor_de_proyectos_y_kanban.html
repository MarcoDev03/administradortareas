                      descripcion: incidentFormData.descripcion.trim(),
                    }
                  : i,
              ),
            );
          } else {
            const newIncident = {
              id: "inc-" + Date.now(),
              projectId: activeProjectId,
              reportadoId: currentUserId || "",
              titulo: incidentFormData.titulo.trim(),
              descripcion: incidentFormData.descripcion.trim(),
              prioridad: incidentFormData.prioridad,
              estado: incidentFormData.estado,
            };
            setIncidents([...incidents, newIncident]);
          }
          setIsIncidentModalOpen(false);
        };

        const handleDeleteIncidentConfirmed = () => {
          if (!deletingIncident) return;
          setIncidents(incidents.filter((i) => i.id !== deletingIncident.id));
          setDeletingIncident(null);
        };

        // Módulos y tareas del proyecto activo
        const activeProject = projects.find((p) => p.id === activeProjectId);
        const projectModules = modules.filter(
          (m) => m.projectId === activeProjectId,
        );
        const projectTasksRaw = tasks.filter(
          (t) => t.projectId === activeProjectId,
        );
        // Los Ayudantes solo ven las tareas que tienen asignadas, no todas las del proyecto
        const projectTasks = isHelper
          ? projectTasksRaw.filter((t) =>
              (t.assignedUserIds || []).includes(currentUserId),
            )
          : projectTasksRaw;

        const todayDateStr = new Date().toISOString().slice(0, 10);

        const currentTasks = projectTasks.filter((t) => {
          if (activeModuleId !== "all" && t.moduleId !== activeModuleId) return false;
          if (kanbanTaskFilter === "hoy" && t.startDate !== todayDateStr) return false;
          return true;
        });

        const activeModuleName =
          activeModuleId === "all"
            ? "Todos los Módulos"
            : modules.find((m) => m.id === activeModuleId)?.name ||
              "Módulo Desconocido";

        // Cálculos de estadísticas
        const totalTasks = currentTasks.length;
        const completedTasks = currentTasks.filter(
          (t) => t.status === "finalizado",
        ).length;
        const progressPercentage =
          totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

        // Incidencias del proyecto activo: se asocian directamente por projectId.
        // (Compatibilidad: si alguna incidencia antigua solo tenía moduloId, se
        // resuelve su proyecto a través del módulo al que pertenecía.)
        const projectIncidents = incidents.filter((i) => {
          if (i.projectId) return i.projectId === activeProjectId;
          const legacyModule = modules.find((m) => m.id === i.moduloId);
          return legacyModule?.projectId === activeProjectId;
        });
        const currentIncidents = projectIncidents;
        const totalIncidents = currentIncidents.length;
        const resolvedIncidents = currentIncidents.filter(
          (i) => i.estado === "resuelta",
        ).length;

        // Usuarios que pueden ser seleccionados al asignar la tarea: solo los miembros
        // con acceso al proyecto al que pertenece la tarea (project.memberUserIds).
        const taskModalProjectId = editingTask
          ? editingTask.projectId
          : taskFormData.projectId || activeProjectId;
        const taskModalProject = projects.find(
          (p) => p.id === taskModalProjectId,
        );
        const taskAssignableUsers = users.filter((u) =>
          (taskModalProject?.memberUserIds || []).includes(u.id),
        );
        // Módulos del proyecto seleccionado en el modal de tarea (puede diferir del proyecto
        // activo del tablero Kanban cuando la tarea se crea desde el Calendario)
        const taskModalModules = modules.filter(
          (m) => m.projectId === taskModalProjectId,
        );
        // El módulo solo se bloquea al módulo activo del tablero cuando la tarea nueva
        // pertenece al mismo proyecto que está activo en el Kanban
        const taskModalLockModule =
          !editingTask &&
          activeModuleId !== "all" &&
          taskModalProjectId === activeProjectId;

        return (
          <div className="flex h-screen bg-slate-100 overflow-hidden">
            {/* Sidebar Overlay para Móvil */}
            {isSidebarOpen && (
              <div
                className="fixed inset-0 bg-slate-900/50 z-20 md:hidden transition-opacity"
                onClick={() => setIsSidebarOpen(false)}
              ></div>
            )}

            <aside
              className={`
                        fixed md:static inset-y-0 left-0 z-30
                        w-72 bg-slate-900 text-slate-300 flex flex-col transition-transform duration-300 transform
                        ${isSidebarOpen ? "translate-x-0" : "-translate-x-full md:translate-x-0"}
                    `}
            >
              {/* Header Sidebar */}
              <div className="p-5 border-b border-slate-800 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="p-2 bg-indigo-600 rounded-lg text-white">
                    <i data-lucide="kanban" className="w-5 h-5"></i>
                  </div>
                  <h1 className="font-bold text-lg text-white tracking-wide">
                    NegocioManager
                  </h1>
                </div>
                <button
                  className="md:hidden text-slate-400 hover:text-white"
                  onClick={() => setIsSidebarOpen(false)}
                >
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              {/* Botón Nuevo Proyecto (solo Admin / Desarrollador pueden crear proyectos) */}
              {!isHelper && (
                <div className="p-4">
                  <button
                    onClick={() => openProjectModal(null)}
                    className="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg flex items-center justify-center space-x-2 transition-all shadow-md shadow-indigo-900/20 active:scale-95 text-sm"
                  >
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    <span>Nuevo Negocio</span>
                  </button>
                </div>
              )}

              {/* Selector de Usuario Actual (Registrador / Reportador) */}
              <div className="px-4 pb-4">
                <label className="block text-[11px] font-semibold text-slate-500 uppercase mb-1.5 tracking-wider">
                  Usuario Actual
                </label>
                <select
                  value={currentUserId}
                  onChange={(e) => setCurrentUserId(e.target.value)}
                  className="w-full text-xs bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2 text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                >
                  <option value="">-- Selecciona un usuario --</option>
                  {users.map((u) => (
                    <option key={u.id} value={u.id}>
                      {u.name} ({u.role})
                    </option>
                  ))}
                </select>
                {!currentUserId && (
                  <p className="text-[10px] text-amber-400 mt-1.5 flex items-start space-x-1">
                    <i
                      data-lucide="alert-triangle"
                      className="w-3 h-3 mt-0.5 shrink-0"
                    ></i>
                    <span>
                      Selecciona o crea un usuario para poder registrar tareas e
                      incidencias.
                    </span>
                  </p>
                )}
              </div>

              {/* Navegación principal: Proyectos (Kanban/Incidencias) o Calendario global de tareas */}
              <div className="px-4 pb-4 grid grid-cols-2 gap-2">

                    ¿Eliminar usuario?
                  </h3>
                  <p className="text-sm text-slate-500 mb-6">
                    ¿Estás seguro de eliminar a{" "}
                    <span className="font-semibold text-slate-700">
                      "{deletingUser.name}"
                    </span>
                    ? Se quitará de las tareas asignadas y de las incidencias
                    reportadas.
                  </p>
                  <div className="flex space-x-3 justify-end">
                    <button
                      type="button"
                      onClick={() => setDeletingUser(null)}
                      className="w-full py-2 px-4 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition"
                    >
                      Cancelar
                    </button>
                    <button
                      type="button"
                      onClick={confirmDeleteUser}
                      className="w-full py-2 px-4 text-sm font-medium bg-red-600 hover:bg-red-700 text-white rounded-lg transition shadow-sm"
                    >
                      Eliminar
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL INCIDENCIA */}
            {isIncidentModalOpen && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-150">
                  <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                    <h3 className="font-bold text-slate-800 text-lg">
                      {editingIncident
                        ? "Editar Incidencia"
                        : "Reportar Incidencia"}
                    </h3>
                    <button
                      onClick={() => setIsIncidentModalOpen(false)}
                      className="text-slate-400 hover:text-slate-600"
                    >
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  <form onSubmit={handleSaveIncident} className="p-6 space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">
                        Título
                      </label>
                      <input
                        type="text"
                        required
                        autoFocus
                        value={incidentFormData.titulo}
                        onChange={(e) =>
                          setIncidentFormData({
                            ...incidentFormData,
                            titulo: e.target.value,
                          })
                        }
                        placeholder="¿Qué problema encontraste?"
                        className="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 text-slate-800 outline-none transition"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">
                        Descripción
                      </label>
                      <textarea
                        rows="3"
                        value={incidentFormData.descripcion}
                        onChange={(e) =>
                          setIncidentFormData({
                            ...incidentFormData,
                            descripcion: e.target.value,
                          })
                        }
                        placeholder="Describe la incidencia: pasos para reproducirla, impacto, etc."
                        className="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 text-slate-800 outline-none transition resize-none"
                      ></textarea>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">
                          Prioridad
                        </label>
                        <select
                          value={incidentFormData.prioridad}
                          onChange={(e) =>
                            setIncidentFormData({
                              ...incidentFormData,
                              prioridad: e.target.value,
                            })
                          }
                          className="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 text-slate-800 outline-none transition"
                        >
                          <option value="baja">Baja</option>
                          <option value="media">Media</option>
                          <option value="alta">Alta</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">
                          Estado
                        </label>
                        <select
                          value={incidentFormData.estado}
                          onChange={(e) =>
                            setIncidentFormData({
                              ...incidentFormData,
                              estado: e.target.value,
                            })
                          }
                          className="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 text-slate-800 outline-none transition"
                        >
                          <option value="abierta">Abierta</option>
                          <option value="en_proceso">En Proceso</option>
                          <option value="resuelta">Resuelta</option>
                        </select>
                      </div>
                    </div>

                    {/* Usuario que reporta la incidencia (solo lectura) */}
                    {editingIncident ? (
                      (() => {
                        const reporter = users.find(
                          (u) => u.id === editingIncident.reportadoId,
                        );
                        return (
                          <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-600 flex items-center justify-between">
                            <span>Reportado por:</span>
                            <span className="font-semibold text-slate-700">
                              {reporter
                                ? `${reporter.name} (${reporter.role})`
                                : "Usuario no disponible"}
                            </span>
                          </div>
                        );
                      })()
                    ) : (
                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-600 flex items-center justify-between">
                        <span>Se registrará como reportante:</span>
                        <span className="font-semibold text-slate-700">
                          {(() => {
                            const reporter = users.find(
                              (u) => u.id === currentUserId,
                            );
                            return reporter
                              ? `${reporter.name} (${reporter.role})`
                              : "Sin usuario seleccionado";
                          })()}
                        </span>
                      </div>
                    )}

                    <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setIsIncidentModalOpen(false)}
                        className="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition"
                      >
                        Cancelar
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 text-sm font-medium bg-red-600 hover:bg-red-700 text-white rounded-lg transition shadow-sm"
                      >
                        Guardar Incidencia
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL ELIMINAR INCIDENCIA */}
            {deletingIncident && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in duration-150 p-6 text-center">
                  <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                  </div>
                  <h3 className="font-bold text-slate-800 text-lg mb-1">
                    ¿Eliminar incidencia?
                  </h3>
                  <p className="text-sm text-slate-500 mb-6">
                    ¿Estás seguro de eliminar la incidencia{" "}
                    <span className="font-semibold text-slate-700">
                      "{deletingIncident.titulo}"
                    </span>
                    ? Esta acción no se puede deshacer.
                  </p>
                  <div className="flex space-x-3 justify-end">
                    <button
                      type="button"
                      onClick={() => setDeletingIncident(null)}
                      className="w-full py-2 px-4 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition"
                    >
                      Cancelar
                    </button>
                    <button
                      type="button"
                      onClick={handleDeleteIncidentConfirmed}
                      className="w-full py-2 px-4 text-sm font-medium bg-red-600 hover:bg-red-700 text-white rounded-lg transition shadow-sm"
                    >
                      Eliminar Incidencia
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL GESTIÓN DE LOCALSTORAGE */}
            {isStorageModalOpen && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-150">
                  <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                    <div className="flex items-center space-x-2">
                      <i
                        data-lucide="hard-drive"
                        className="w-5 h-5 text-indigo-600"
                      ></i>
                      <h3 className="font-bold text-slate-800 text-lg">
                        Almacenamiento Local
                      </h3>
                    </div>
                    <button
                      onClick={() => setIsStorageModalOpen(false)}
                      className="text-slate-400 hover:text-slate-600"
                    >
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  <div className="p-6 space-y-4">
                    <div className="bg-slate-50 p-3.5 rounded-lg border border-slate-200 text-xs text-slate-600 space-y-1">
                      <div className="font-semibold text-slate-700">
                        Estado de los datos:
                      </div>
                      <div className="flex justify-between">
                        <span>Proyectos guardados:</span>
                        <span className="font-bold text-indigo-600">
                          {projects.length}
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>Módulos guardados:</span>
                        <span className="font-bold text-indigo-600">
                          {modules.length}
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>Tareas guardadas:</span>
                        <span className="font-bold text-indigo-600">
                          {tasks.length}
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>Usuarios guardados:</span>
                        <span className="font-bold text-indigo-600">
                          {users.length}
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>Incidencias guardadas:</span>
                        <span className="font-bold text-indigo-600">
                          {incidents.length}
                        </span>
                      </div>
                    </div>

                    {storageMessage && (
                      <div className="p-3 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded-lg text-xs font-medium">
                        {storageMessage}
                      </div>
                    )}

                    <div className="space-y-2 pt-2">
                      <button
                        onClick={handleExportData}
                        className="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition"
                      >
                        <i data-lucide="download" className="w-4 h-4"></i>
                        <span>Exportar Copia de Seguridad (JSON)</span>
                      </button>

                      <label className="w-full py-2.5 px-4 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-lg text-sm font-medium flex items-center justify-center space-x-2 cursor-pointer transition">
                        <i data-lucide="upload" className="w-4 h-4"></i>
                        <span>Importar Copia de Seguridad</span>
                        <input
                          type="file"
                          accept=".json"
                          onChange={handleImportData}
                          className="hidden"
                        />
                      </label>

                      <button
                        onClick={() => setIsResetConfirmOpen(true)}
                        className="w-full py-2.5 px-4 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition mt-4"
                      >
                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                        <span>Vaciar Todo el LocalStorage</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL CONFIRMAR RESET DE DATOS */}
            {isResetConfirmOpen && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden animate-in fade-in zoom-in duration-150 p-6 text-center">
                  <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="alert-octagon" className="w-6 h-6"></i>
                  </div>
                  <h3 className="font-bold text-slate-800 text-lg mb-1">
                    ¿Vaciar almacenamiento?
                  </h3>
                  <p className="text-sm text-slate-500 mb-6">
                    Esta acción eliminará de manera permanente todos tus
                    proyectos, módulos, tareas, usuarios e incidencias del
                    LocalStorage.
                  </p>
                  <div className="flex space-x-3 justify-end">
                    <button
                      type="button"
                      onClick={() => setIsResetConfirmOpen(false)}
                      className="w-full py-2 px-4 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition"
                    >
                      Cancelar
                    </button>
                    <button
                      type="button"
                      onClick={confirmResetAllData}
                      className="w-full py-2 px-4 text-sm font-medium bg-red-600 hover:bg-red-700 text-white rounded-lg transition shadow-sm"
                    >
                      Borrar Todo
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
