<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Inner border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#818cf8" stroke-width="4" stroke-opacity="0.4" />

  <!-- Kanban Columns Icon -->
  <g filter="url(#shadow)">
    <!-- Column 1 (Left - Tall) -->
    <rect x="100" y="120" width="80" height="272" rx="18" fill="url(#barGrad)" />
    <rect x="114" y="142" width="52" height="60" rx="8" fill="#4f46e5" fill-opacity="0.25" />
    <rect x="114" y="216" width="52" height="90" rx="8" fill="#4f46e5" fill-opacity="0.25" />
    <rect x="114" y="320" width="52" height="48" rx="8" fill="#4f46e5" fill-opacity="0.25" />

    <!-- Column 2 (Center - Medium) -->
    <rect x="216" y="120" width="80" height="200" rx="18" fill="url(#barGrad)" />
    <rect x="230" y="142" width="52" height="80" rx="8" fill="#4f46e5" fill-opacity="0.25" />
    <rect x="230" y="236" width="52" height="60" rx="8" fill="#4f46e5" fill-opacity="0.25" />

    <!-- Column 3 (Right - Taller) -->
    <rect x="332" y="120" width="80" height="240" rx="18" fill="url(#barGrad)" />
    <rect x="346" y="142" width="52" height="110" rx="8" fill="#4f46e5" fill-opacity="0.25" />
    <rect x="346" y="266" width="52" height="70" rx="8" fill="#4f46e5" fill-opacity="0.25" />
  </g>
</svg>